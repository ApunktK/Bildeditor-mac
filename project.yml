# XcodeGen-Beschreibung – erzeugt Bildeditor.xcodeproj (`xcodegen generate`).
name: Bildeditor
options:
  bundleIdPrefix: de.apunktk
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: 0.2.0
    CURRENT_PROJECT_VERSION: 2
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    DEAD_CODE_STRIPPING: YES
packages:
  EditorKit:
    path: Packages/EditorKit
targets:
  Bildeditor:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: EditorKit
        product: EditorCore
      - package: EditorKit
        product: EditorDocument
    settings:
      base:
        INFOPLIST_FILE: Packaging/Info.plist
        CODE_SIGN_ENTITLEMENTS: Packaging/Bildeditor.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: de.apunktk.bildeditor
        PRODUCT_NAME: Bildeditor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Release:
          ARCHS: "arm64 x86_64"
          ONLY_ACTIVE_ARCH: NO
  BildeditorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AppTests
    dependencies:
      - target: Bildeditor
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Bildeditor.app/Contents/MacOS/Bildeditor"
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Bildeditor:
    build:
      targets:
        Bildeditor: all
        BildeditorTests: [test]
    test:
      targets:
        - BildeditorTests
